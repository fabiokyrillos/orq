[project]
name = "orq"
version = "0.1.0"
description = "Local Claude Code <-> Codex orchestrator that drives a task to a merged PR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
orq = "orq.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: calls real CLIs or the network; run explicitly with -m integration",
]
